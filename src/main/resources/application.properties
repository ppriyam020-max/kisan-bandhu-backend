spring.application.name=kisan-bandhu-backend

server.port=${SERVER_PORT:8080}

# MySQL Database - Aiven
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Jackson
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# JWT
jwt.secret=${JWT_SECRET:change-this-development-secret-key-32-bytes-minimum-123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000,http://localhost:5173}

# Queue
app.queue.avg-processing-minutes=${AVG_PROCESSING_MINUTES:5}

# OTP
app.otp.dev-mode=${OTP_DEV_MODE:true}